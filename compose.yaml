services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot_data:/app/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: namoz_sarhisobi
      POSTGRES_USER: namoz_user
      POSTGRES_PASSWORD: namoz_secret_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namoz_user -d namoz_sarhisobi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  bot_data:
